<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Font Subsetter</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@24,400,0,0");
      @import url("https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@100;200;300;400;500;600;700&family=Roboto+Mono:wght@100;200;300;400;500;600;700&display=swap");
      * {
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #000;
        color: #fff;
        font-family: "Roboto Mono", "M PLUS 1 Code", sans-serif;
        font-size: 16px;
        line-height: 1.3;
        transition: background-color 0.3s ease;
      }
      .dragover body {
        background-color: #222;
      }
      .app {
        max-width: 700px;
        margin: 0 auto;
        padding: 10px;
      }
      .app-result {
        display: none;
      }
      .apptitle,
      .fontname {
        font-weight: inherit;
        font-size: 30px;
      }
      .appdesc,
      .fontdesc {
        font-size: 14px;
        color: #999;
      }
      .progressboxlist {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .progressboxlist div {
        width: 16px;
        height: 16px;
        background-color: #333;
        transition: background-color 0.3s ease;
      }
      .progressboxlist div.done {
        background-color: #0ff;
      }
      .app hr {
        height: 0;
        border: 1px solid #333;
        margin: 10px 0;
      }
      .dllinks {
        display: flex;
        gap: 10px;
        margin: 10px;
      }
      .dllinks > a {
        position: relative;
        display: block;
        flex: 1;
        min-width: 0;
        color: inherit;
        text-decoration: none;
        border: 1px solid #444;
        border-radius: 5px;
        padding: 10px 15px;
        padding-left: 70px;
        transition: background-color 0.15s ease-out;
      }
      .dllinks > a[href]:before {
        content: "\f090";
        font-family: "Material Symbols Sharp";
        display: block;
        position: absolute;
        top: 9px;
        left: 10px;
        font-size: 48px;
        line-height: 1;
      }
      .dllinks > a:not(a[href]) {
        opacity: 0.75;
        background-color: #222;
        cursor: default;
      }
      .dllinks > a:not(a[href]):before {
        content: "";
        display: block;
        position: absolute;
        top: 13px;
        left: 15px;
        width: 32px;
        height: 32px;
        border: 4px solid #333;
        border-top-color: #fff;
        border-radius: 50%;
        animation: rotate 1s linear infinite;
      }
      .dllinks > a[href]:hover {
        background-color: #333;
      }
      .filename {
        font-size: 20px;
        display: flex;
      }
      .filenamehead {
        flex: 1;
        min-width: 0;
        max-width: max-content;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .filedesc {
        font-size: 14px;
        color: #999;
      }
      .dropzone {
        position: relative;
        margin: 10px 0;
        text-align: center;
        padding: 40px 10px;
        border: 4px dashed #999;
        border-radius: 10px;
        color: #ddd;
        line-height: 1;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      .dropzone-input {
        position: absolute;
        top: 0;
        left: 0;
        opacity: 0;
      }
      .dragover .dropzone,
      .dropzone:hover {
        border-color: #fff;
        color: #fff;
        background-color: #222;
      }
      .dropzone-icon {
        font-family: "Material Symbols Sharp";
        font-size: 48px;
        margin-bottom: 20px;
      }

      @keyframes rotate {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="app-start">
        <h1 class="apptitle">Web Font Subsetter</h1>
        <p class="appdesc">@mochiya98</p>
        <hr />
        <p>
          このツールを使うとGoogle
          fontsの日本語フォントと同じように分割されたサブセットを簡単に生成することができます。
        </p>
        <p>
          フォントファイルをドラッグアンドドロップすると、変換処理が始まります。
        </p>
        <div class="dropzone">
          <input type="file" class="dropzone-input" />
          <div class="dropzone-icon">&#59900;</div>
          <div class="dropzone-text">Drop font file here</div>
        </div>
      </div>
      <div class="app-result">
        <h1 class="fontname">Loading...</h1>
        <p class="fontdesc">weight=100, glyphs=0</p>
        <hr />
        <div class="dllinks">
          <a id="link-ansi">
            <div class="filename">
              <div class="filenamehead">x</div>
              -ansi.woff2
            </div>
            <div class="filedesc">ANSI only</div>
          </a>
          <a id="link-jpchunks">
            <div class="filename">
              <div class="filenamehead">x</div>
              -jpchunks.zip
            </div>
            <div class="filedesc">chunked</div>
          </a>
        </div>
        <div class="progressboxlist"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script>
      const progressboxlist = document.querySelector(".progressboxlist");
      const unicodeRangesPromise = fetch(
        "https://fonts.googleapis.com/css2?family=Noto+Sans+JP"
      )
        .then((c) => c.text())
        .then((c) =>
          c.match(/unicode-range:\s*[^;]+/g).map((c) => c.slice(14).trimStart())
        );
      const parseUnicodeRange = (unicodeRange) =>
        unicodeRange.split(",").map((range) => {
          const match = range
            .trim()
            .match(/^U\+([0-9a-f?]{1,6})(?:-([0-9a-f]{1,6}))?$/i);
          if (!match) {
            throw new Error(`Invalid unicode-range: ${range}`);
          }
          const start = parseInt(match[1].replace(/\?/g, "0"), 16);
          const end = parseInt(
            (match[2] || match[1]).replace(/\?/g, "f"),
            16
          );
          return [start, end];
        });
      const mergeCodePointRanges = (ranges) =>
        ranges
          .map((range) => [...range])
          .sort((a, b) => a[0] - b[0])
          .reduce((merged, range) => {
            const previous = merged.at(-1);
            if (previous && range[0] <= previous[1] + 1) {
              previous[1] = Math.max(previous[1], range[1]);
            } else {
              merged.push(range);
            }
            return merged;
          }, []);
      const makeRemainingUnicodeRange = (unicodeRanges) => {
        const coveredRanges = mergeCodePointRanges(
          unicodeRanges.flatMap(parseUnicodeRange)
        );
        const unicodeScalarRanges = [
          [0x000000, 0x00d7ff],
          [0x00e000, 0x10ffff],
        ];
        const remainingRanges = [];
        for (const [unicodeStart, unicodeEnd] of unicodeScalarRanges) {
          let start = unicodeStart;
          for (const [coveredStart, coveredEnd] of coveredRanges) {
            if (coveredEnd < start) continue;
            if (coveredStart > unicodeEnd) break;
            if (coveredStart > start) {
              remainingRanges.push([
                start,
                Math.min(coveredStart - 1, unicodeEnd),
              ]);
            }
            start = Math.max(start, coveredEnd + 1);
            if (start > unicodeEnd) break;
          }
          if (start <= unicodeEnd) remainingRanges.push([start, unicodeEnd]);
        }
        return remainingRanges
          .map(([start, end]) => {
            const startHex = start.toString(16).toUpperCase().padStart(4, "0");
            const endHex = end.toString(16).toUpperCase().padStart(4, "0");
            return start === end
              ? `U+${startHex}`
              : `U+${startHex}-${endHex}`;
          })
          .join(", ");
      };
      const plannedUnicodeRangesPromise = unicodeRangesPromise.then((ranges) => [
        ...ranges,
        makeRemainingUnicodeRange(ranges),
      ]);
      const isUnicodeScalar = (codePoint) =>
        Number.isInteger(codePoint) &&
        codePoint >= 0 &&
        codePoint <= 0x10ffff &&
        !(codePoint >= 0xd800 && codePoint <= 0xdfff);
      const containsCodePoint = (ranges, codePoint) => {
        let left = 0;
        let right = ranges.length - 1;
        while (left <= right) {
          const middle = (left + right) >> 1;
          const [start, end] = ranges[middle];
          if (codePoint < start) {
            right = middle - 1;
          } else if (codePoint > end) {
            left = middle + 1;
          } else {
            return true;
          }
        }
        return false;
      };
      const formatCodePoint = (codePoint) =>
        codePoint.toString(16).toUpperCase().padStart(4, "0");
      const codePointsToUnicodeRange = (codePoints) => {
        const sortedCodePoints = [...new Set(codePoints)]
          .filter(isUnicodeScalar)
          .sort((a, b) => a - b);
        if (!sortedCodePoints.length) return "";

        const ranges = [];
        let start = sortedCodePoints[0];
        let end = start;
        for (const codePoint of sortedCodePoints.slice(1)) {
          if (codePoint === end + 1) {
            end = codePoint;
          } else {
            ranges.push([start, end]);
            start = end = codePoint;
          }
        }
        ranges.push([start, end]);

        return ranges
          .map(([rangeStart, rangeEnd]) =>
            rangeStart === rangeEnd
              ? `U+${formatCodePoint(rangeStart)}`
              : `U+${formatCodePoint(rangeStart)}-${formatCodePoint(rangeEnd)}`
          )
          .join(", ");
      };
      const makeCmapAwareSubsets = (unicodeRanges, cmapGroups) => {
        const parsedRanges = unicodeRanges.map((unicodeRange) =>
          mergeCodePointRanges(parseUnicodeRange(unicodeRange))
        );
        const subsetCodePoints = unicodeRanges.map(() => new Set());

        for (const cmapGroup of cmapGroups) {
          const groupCodePoints = [...new Set(cmapGroup)]
            .filter(isUnicodeScalar)
            .sort((a, b) => a - b);
          if (!groupCodePoints.length) continue;

          const targetSubsetIndexes = new Set();
          for (const codePoint of groupCodePoints) {
            parsedRanges.forEach((ranges, subsetIndex) => {
              if (containsCodePoint(ranges, codePoint)) {
                targetSubsetIndexes.add(subsetIndex);
              }
            });
          }

          // 予定範囲内のコードポイントが参照する実体グリフについて、
          // 同じグリフへcmapされる全コードポイントを同じサブセットへ含める。
          for (const subsetIndex of targetSubsetIndexes) {
            const targetCodePoints = subsetCodePoints[subsetIndex];
            for (const codePoint of groupCodePoints) {
              targetCodePoints.add(codePoint);
            }
          }
        }

        return subsetCodePoints.map((codePoints, sourceIndex) => ({
          sourceIndex,
          unicodeRange: codePointsToUnicodeRange(codePoints),
        }));
      };
      const createProgressBoxes = (count) => {
        progressboxlist.replaceChildren();
        return Array.from({ length: count }, () =>
          progressboxlist.appendChild(document.createElement("div"))
        );
      };
      const PYODIDE_BASE_URL =
        "https://cdn.jsdelivr.net/pyodide/v314.0.3/full/";
      const workerScript = `
            import { loadPyodide } from "${PYODIDE_BASE_URL}pyodide.mjs";

            let pyodide;
            let subsetMain;
            async function loadPyodideAndPackages() {
              pyodide = await loadPyodide({
                indexURL: "${PYODIDE_BASE_URL}",
              });
              await pyodide.loadPackage(["fonttools", "brotli"]);
              subsetMain = await pyodide.runPythonAsync(
                "from fontTools.subset import main\\nmain"
              );
            }
            const pyodideReadyPromise = loadPyodideAndPackages();
            let sid = null;

            self.onmessage = async (event) => {
              const { id, type } = event.data;
              if (type === "init") {
                sid = event.data.sid;
                return;
              }

              let result = null;
              try {
                if (event.data.sid !== sid) throw new Error("invalid sid");

                if (type === "load_file") {
                  await pyodideReadyPromise;
                  const data = new Uint8Array(await event.data.file.arrayBuffer());
                  pyodide.FS.writeFile("/input.bin", data);
                  const infoJson = await pyodide.runPythonAsync(
                    "import json\\n" +
                      "from fontTools import ttLib\\n" +
                      "font=ttLib.TTFont('/input.bin', lazy=True)\\n" +
                      "glyph_order=font.getGlyphOrder()\\n" +
                      "glyph_name_to_id={name: gid for gid, name in enumerate(glyph_order)}\\n" +
                      "effective_cmap=dict(font['cmap'].getBestCmap() or {})\\n" +
                      "for cmap_table in font['cmap'].tables:\\n" +
                      "    if cmap_table.isUnicode():\\n" +
                      "        for code_point, glyph_name in getattr(cmap_table, 'cmap', {}).items():\\n" +
                      "            effective_cmap.setdefault(code_point, glyph_name)\\n" +
                      "cmap_groups={}\\n" +
                      "if " + (event.data.includeCmap ? "True" : "False") + ":\\n" +
                      "    for code_point, glyph_name in effective_cmap.items():\\n" +
                      "        glyph_id=glyph_name_to_id.get(glyph_name)\\n" +
                      "        if glyph_id is None or glyph_id == 0:\\n" +
                      "            continue\\n" +
                      "        if not (0 <= code_point <= 0x10FFFF) or 0xD800 <= code_point <= 0xDFFF:\\n" +
                      "            continue\\n" +
                      "        cmap_groups.setdefault(glyph_id, []).append(code_point)\\n" +
                      "info={\\n" +
                      "    'glyphs': len(glyph_order),\\n" +
                      "    'weight': font['OS/2'].usWeightClass,\\n" +
                      "    'familyName': font['name'].getDebugName(16) or font['name'].getDebugName(1),\\n" +
                      "    'name': font['name'].getDebugName(4),\\n" +
                      "    'cmapGroups': [sorted(code_points) for code_points in cmap_groups.values()],\\n" +
                      "}\\n" +
                      "font.close()\\n" +
                      "json.dumps(info, ensure_ascii=False, separators=(',', ':'))"
                  );
                  result = JSON.parse(infoJson);
                } else if (type === "make_subset") {
                  await pyodideReadyPromise;
                  subsetMain([
                    "/input.bin",
                    "--output-file=/out.woff2",
                    "--flavor=woff2",
                    "--desubroutinize",
                    "--layout-features=*",
                    "--unicodes=" + event.data.u,
                  ]);
                  result = pyodide.FS.readFile("/out.woff2");
                }
              } catch (error) {
                result = { __error: error?.message || String(error) };
              }

              if (result instanceof Uint8Array) {
                self.postMessage({ id, result }, [result.buffer]);
              } else {
                self.postMessage({ id, result });
              }
            };
            `;
      const MAX_PYODIDE_WORKERS = 2;
      const PYODIDE_WORKER_COUNT = Math.min(
        MAX_PYODIDE_WORKERS,
        Math.max(1, Math.floor((navigator.hardwareConcurrency || 2) / 2))
      );

      const createWorkerClient = () => {
        const workerUrl = URL.createObjectURL(
          new Blob([workerScript], { type: "text/javascript" })
        );
        const worker = new Worker(workerUrl, { type: "module" });
        const callbacks = new Map();

        worker.onmessage = ({ data: { id, result } }) => {
          const callback = callbacks.get(id);
          if (!callback) return;
          callbacks.delete(id);
          if (result?.__error) {
            callback.reject(new Error(result.__error));
          } else {
            callback.resolve(result);
          }
        };

        worker.onerror = (event) => {
          const error = new Error(event.message || "Worker error");
          for (const { reject } of callbacks.values()) reject(error);
          callbacks.clear();
        };

        const rejectPending = () => {
          for (const { reject } of callbacks.values()) {
            reject(new Error("cancelled"));
          }
          callbacks.clear();
        };

        const run = (sid, data) =>
          new Promise((resolve, reject) => {
            const id =
              crypto.randomUUID?.() || Math.random().toString(36).slice(2);
            callbacks.set(id, { resolve, reject });
            worker.postMessage({ id, sid, ...data });
          });

        return { worker, run, rejectPending };
      };

      // 複数のPyodide Workerを先に起動し、独立したサブセットを並列生成する。
      const pyodideWorkers = Array.from(
        { length: PYODIDE_WORKER_COUNT },
        createWorkerClient
      );
      let currentSid = null;

      const startPyodidePipeline = () => {
        pyodideWorkers.forEach(({ rejectPending }) => rejectPending());
        const sid =
          crypto.randomUUID?.() || Math.random().toString(36).slice(2);
        currentSid = sid;
        pyodideWorkers.forEach(({ worker }) =>
          worker.postMessage({ id: null, sid, type: "init" })
        );

        const waitPromise = async (promise) => {
          const result = await promise;
          if (currentSid !== sid) throw new Error("cancelled");
          return result;
        };

        const runInPyodideWorker = (workerIndex, data) =>
          waitPromise(pyodideWorkers[workerIndex].run(sid, data));

        return { runInPyodideWorker, waitPromise };
      };

      let ansiObjectUrl = null;
      let chunksObjectUrl = null;

      const loadFontFile = async (file) => {
        const { runInPyodideWorker, waitPromise } = startPyodidePipeline();
        const appStart = document.querySelector(".app-start");
        const appResult = document.querySelector(".app-result");
        const fontName = document.querySelector(".fontname");
        const fontDesc = document.querySelector(".fontdesc");
        const ansiLink = document.querySelector("#link-ansi");
        const chunksLink = document.querySelector("#link-jpchunks");

        appStart.style.display = "none";
        appResult.style.display = "block";
        fontName.textContent = "Loading...";

        if (ansiObjectUrl) URL.revokeObjectURL(ansiObjectUrl);
        if (chunksObjectUrl) URL.revokeObjectURL(chunksObjectUrl);
        ansiObjectUrl = null;
        chunksObjectUrl = null;
        ansiLink.removeAttribute("href");
        chunksLink.removeAttribute("href");
        progressboxlist.replaceChildren();

        const chunkName = file.name.replace(/\.[^.]+$/, "");
        document.querySelector("#link-ansi .filenamehead").textContent =
          chunkName;
        document.querySelector("#link-jpchunks .filenamehead").textContent =
          chunkName;

        // File/Blobを直接渡し、100KBごとのpostMessage往復とsliceを削除する。
        const loadResults = await Promise.all(
          pyodideWorkers.map((_, workerIndex) =>
            runInPyodideWorker(workerIndex, {
              type: "load_file",
              file,
              includeCmap: workerIndex === 0,
            })
          )
        );
        const { cmapGroups, glyphs, familyName, name, weight } = loadResults[0];
        fontName.textContent = name;
        fontDesc.textContent = `weight=${weight}, glyphs=${glyphs}`;

        const plannedUnicodeRanges = await waitPromise(
          plannedUnicodeRangesPromise
        );
        const outputSubsets = makeCmapAwareSubsets(
          plannedUnicodeRanges,
          cmapGroups
        ).filter(({ unicodeRange }) => unicodeRange);
        const [ansiSubset] = makeCmapAwareSubsets(
          ["U+0020-00FF"],
          cmapGroups
        );
        const progressboxes = createProgressBoxes(outputSubsets.length + 1);
        const zip = new JSZip();
        zip.file(
          `${chunkName}.css`,
          outputSubsets
            .map(
              ({ unicodeRange }, index) => `@font-face {
        font-family: '${familyName}';
        font-style: normal;
        font-weight: ${weight};
        font-display: swap;
        src: url(./${chunkName}.${index}.woff2) format('woff2');
        unicode-range: ${unicodeRange};
      }`
            )
            .join("\n"),
          { encoding: "utf8" }
        );

        // Worker 0がANSIを処理している間、他のWorkerは日本語チャンクを進める。
        const ansiPromise = runInPyodideWorker(0, {
          type: "make_subset",
          u: ansiSubset.unicodeRange,
        }).then((ansiBuf) => {
          progressboxes[0].classList.add("done");
          ansiObjectUrl = URL.createObjectURL(
            new Blob([ansiBuf], { type: "font/woff2" })
          );
          ansiLink.href = ansiObjectUrl;
          ansiLink.download = chunkName + "-ansi.woff2";
        });

        let nextRangeIndex = 0;
        const processRanges = async (workerIndex) => {
          if (workerIndex === 0) await ansiPromise;

          while (true) {
            const rangeIndex = nextRangeIndex++;
            if (rangeIndex >= outputSubsets.length) return;
            const data = await runInPyodideWorker(workerIndex, {
              type: "make_subset",
              u: outputSubsets[rangeIndex].unicodeRange,
            });
            zip.file(`${chunkName}.${rangeIndex}.woff2`, data);
            progressboxes[rangeIndex + 1].classList.add("done");
          }
        };

        await Promise.all([
          ansiPromise,
          ...pyodideWorkers.map((_, workerIndex) => processRanges(workerIndex)),
        ]);

        const content = await waitPromise(
          zip.generateAsync({ type: "blob", streamFiles: true })
        );
        chunksObjectUrl = URL.createObjectURL(content);
        chunksLink.href = chunksObjectUrl;
        chunksLink.download = chunkName + "-jpchunks.zip";
      };

      window.addEventListener("dragover", (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "copy";
        document.documentElement.classList.add("dragover");
      });
      window.addEventListener("dragleave", (e) => {
        document.documentElement.classList.remove("dragover");
      });
      const tryLoadFile = (file) => {
        loadFontFile(file).catch((error) => {
          if (error.message === "cancelled") return;
          console.error(error);
          document.querySelector(".fontname").textContent = "Error";
          document.querySelector(".fontdesc").textContent = error.message;
        });
      };

      window.addEventListener("drop", (e) => {
        e.preventDefault();
        document.documentElement.classList.remove("dragover");
        const file = e.dataTransfer.files[0];
        if ((file?.name || "").match(/\.(?:woff2?|ttf|otf)$/)) {
          tryLoadFile(file);
        }
      });
      document
        .querySelector(".dropzone-input")
        .addEventListener("change", () => {
          const file = document.querySelector(".dropzone-input").files[0];
          if ((file?.name || "").match(/\.(?:woff2?|ttf|otf)$/)) {
            tryLoadFile(file);
          }
        });
      document.querySelector(".dropzone").addEventListener("click", (e) => {
        document.querySelector(".dropzone-input").click();
      });
    </script>
  </body>
</html>
